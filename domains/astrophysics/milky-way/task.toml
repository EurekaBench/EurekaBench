task_vocabulary = ["halo variance", "Milky Way", "dark matter", "1,024"]

[metadata.simulator]
name = "dreams-cdm-mw-trees"
workspace_dirs = ["dreams_data"]
records = "accessed_sims.json"

[[metadata.source_literature]]
titles = ["The DREAMS Project: Disentangling the Impact of Halo-to-Halo Variance and Baryonic Feedback on Milky Way Dark Matter Density Profiles", "Disentangling the Impact of Halo-to-Halo Variance and Baryonic Feedback on Milky Way Dark Matter Density Profiles"]
phrases = ["halo-to-halo variance", "halo to halo variance", "disentangling the impact of halo"]
authors = ["Garcia", "Rose", "Torrey", "Caputo", "Lisanti", "Pace", "Villaescusa-Navarro", "Vogelsberger"]
years = [2025]
venues = ["arXiv"]
ids = ["2512.03132"]

[[metadata.source_literature]]
titles = ["The DREAMS Project: A New Suite of 1,024 Simulations to Contextualize the Milky Way and Assess Physics Uncertainties", "A New Suite of 1,024 Simulations to Contextualize the Milky Way and Assess Physics Uncertainties"]
phrases = ["contextualize the milky way", "assess physics uncertainties", "suite of 1,024 simulations", "suite of 1024 simulations"]
authors = ["Rose", "Lisanti", "Torrey", "Villaescusa-Navarro", "Garcia", "Farahi", "Vogelsberger"]
years = [2025]
venues = ["arXiv"]
ids = ["2512.00148"]

[agent]
timeout_sec = 14400

[verifier]
timeout_sec = 172800
environment_mode = "separate"

[environment]
docker_image = "astrophysics.sif"
workdir = "/workspace"
