venues = ["PLOS Biology", "PLoS Biology"]
ids = ["10.1371/journal.pbio.3001524", "pbio.3001524", "3001524"]

[[metadata.source_literature]]
titles = ["A quantitative model of conserved macroscopic dynamics predicts future motor commands", "Universality of macroscopic neuronal dynamics in Caenorhabditis elegans"]
phrases = ["macroscopic dynamics", "future motor commands", "universality of macroscopic"]
authors = ["Brennan", "Proekt"]
years = [2019, 2017]
