task_vocabulary = ["c302", "OpenWorm"]

[metadata.simulator]
name = "c302"

[metadata.simulator.defaults]
param_overrides = {"neuron_to_neuron_elec_syn_gbase" = "0.09 nS"}

[[metadata.source_literature]]
titles = ["An integrative data-driven model simulating C. elegans brain, body and environment interactions", "MetaWorm: An Integrative Data-Driven Model Simulating C. elegans Brain, Body and Environment Interactions"]
phrases = ["metaworm", "baaiworm", "integrative data-driven model", "brain, body and environment"]
authors = ["Zhao", "Wang", "Jiang", "Ma", "He", "Du", "Huang"]
years = [2024]
venues = ["Nature Computational Science", "Nat Comput Sci", "bioRxiv"]
ids = ["10.1038/s43588-024-00738-w", "s43588-024-00738-w", "10.1101/2024.02.22.581686", "2024.02.22.581686", "581686"]

[[metadata.source_literature]]
titles = ["A circuit for gradient climbing in C. elegans chemotaxis"]
phrases = ["gradient climbing"]
authors = ["Larsch", "Flavell", "Liu", "Gordus", "Albrecht", "Bargmann"]
years = [2015]
venues = ["Cell Reports", "Cell Rep"]
ids = ["10.1016/j.celrep.2015.08.032", "j.celrep.2015.08.032", "26365196", "PMC5045890"]

[[metadata.source_literature]]
titles = ["Gait modulation in C. elegans: an integrated neuromechanical model"]
phrases = ["gait modulation", "integrated neuromechanical model"]
authors = ["Boyle", "Berri", "Cohen"]
years = [2012]
venues = ["Frontiers in Computational Neuroscience", "Front Comput Neurosci"]
ids = ["10.3389/fncom.2012.00010", "fncom.2012.00010"]

[[metadata.source_literature]]
titles = ["c302: a multiscale framework for modelling the nervous system of Caenorhabditis elegans"]
phrases = ["c302", "openworm", "multiscale framework"]
authors = ["Gleeson", "Lung", "Grosu", "Hasani", "Larson"]
years = [2018]
venues = ["Philosophical Transactions", "Phil Trans", "Royal Society B", "rstb"]
ids = ["10.1098/rstb.2017.0379", "rstb.2017.0379", "20170379", "PMC6158223", "10056647"]

[agent]
timeout_sec = 14400

[verifier]
timeout_sec = 172800
environment_mode = "separate"

[environment]
docker_image = "neuroscience.sif"
workdir = "/workspace"
