schema_version = "1.4"
artifacts = ["/workspace/mechanism", "/workspace/training"]

[metadata]
deliverables = ["mechanism/mechanism.md", "mechanism/influence_fn.py", "mechanism/experiment.log"]
mechanisms_max_mb = 500
blocked_hosts = [
    "huggingface.co", "www.huggingface.co", "hf.co", "cdn-lfs.huggingface.co", "cdn-lfs-us-1.huggingface.co",
    "cdn-lfs-eu-1.huggingface.co", "github.com", "www.github.com", "raw.githubusercontent.com",
    "codeload.github.com", "objects.githubusercontent.com", "github.io", "gitlab.com", "www.gitlab.com", "pypi.org",
    "pypi.python.org", "files.pythonhosted.org", "registry.npmjs.org", "conda.anaconda.org", "anaconda.org",
    "arxiv.org", "www.arxiv.org", "export.arxiv.org", "alphaxiv.org", "www.alphaxiv.org", "openreview.net",
    "www.openreview.net", "semanticscholar.org", "www.semanticscholar.org", "api.semanticscholar.org",
    "openalex.org", "api.openalex.org", "crossref.org", "api.crossref.org", "doi.org", "dx.doi.org",
    "scholar.google.com", "scholar.archive.org", "researchgate.net", "www.researchgate.net", "paperswithcode.com",
    "www.paperswithcode.com", "aclanthology.org", "www.aclanthology.org", "ar5iv.labs.arxiv.org", "ar5iv.org",
    "www.ar5iv.org", "web3.arxiv.org", "emergentmind.com", "www.emergentmind.com", "alignment.anthropic.com",
    "alignmentforum.org", "www.alignmentforum.org", "lesswrong.com", "www.lesswrong.com", "greaterwrong.com",
    "www.greaterwrong.com", "nature.com", "www.nature.com", "natureasia.com", "www.natureasia.com",
    "arxiviq.substack.com", "simonwillison.net", "gigazine.net",
]
sandbox_env = {HF_HUB_OFFLINE = "1"}
task_vocabulary = ["subliminal learning"]

[metadata.simulator]
name = "lm-subliminal"
args = {blackbox = "qwen3-8b-octopus", task = "octopus_preference", seed = 0, domain = "subliminal_influence"}
verifier_args = {blackbox = "qwen3-8b-octopus", task = "octopus_preference", seed = 1, domain = "subliminal_judge"}

[[metadata.stages]]
name = "infer"
timeout_sec = 14400

[[metadata.stages]]
name = "training"
instruction = "stages/training/instruction.md"
timeout_sec = 14400
needs = "mechanism/mechanism.md"
deliverables = ["results/submission.json"]
collect = "training/results"
carry = [{from = ["mechanism"], to = "mechanism"}]
simulator = {domain = "subliminal_training"}

[metadata.judge]
evaluation = "host"
list_all_criteria = true
reset_simulator = true
gpu_phases = ["insights_strict"]
timeout_sec = 14400

[[metadata.source_literature]]
titles = ["Subliminal Learning: Language models transmit behavioral traits via hidden signals in data", "Language models transmit behavioural traits through hidden signals in data"]
phrases = ["subliminal learning"]
authors = ["Cloud", "Le", "Chua", "Betley", "Sztyber-Betley", "Hilton", "Marks", "Evans"]
years = [2025, 2026]
venues = ["arXiv", "Nature"]
ids = ["2507.14805", "10.48550/arXiv.2507.14805", "10.1038/s41586-026-10319-8", "s41586-026-10319-8", "cGcwQDKAKbQ68BGuR", "MinhxLe/subliminal-learning"]

[agent]
timeout_sec = 30600

[verifier]
timeout_sec = 172800
environment_mode = "separate"

[environment]
docker_image = "computer-science.sif"
workdir = "/workspace"
