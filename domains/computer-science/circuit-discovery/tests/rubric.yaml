predictive_accuracy:
  criteria:
    - id: PA-Direct-llama3/mcqa-CMD
      machine: true
      criterion: >-
        The submitted circuit importances.json is evaluated on llama3/mcqa, and CMD is the area between its faithfulness curve and 1. Score = 0.09 / (0.09 + CMD), where 0.09 is the best CMD that MIB reports for llama3/mcqa. A circuit that could not be produced scores 0.
    - id: PA-Direct-llama3/mcqa-CPR
      machine: true
      criterion: >-
        The submitted circuit importances.json is evaluated on llama3/mcqa, and CPR is the area under its faithfulness curve. Score = CPR / (CPR + 1.87), where 1.87 is the best CPR that MIB reports for llama3/mcqa, and a CPR that is not positive scores 0. A circuit that could not be produced scores 0.
    - id: PA-Rerun-llama3/mcqa-CMD
      machine: true
      criterion: >-
        The submitted method.py is rerun on llama3/mcqa and the circuit it produces is evaluated, and CMD is the area between its faithfulness curve and 1. Score = 0.09 / (0.09 + CMD), where 0.09 is the best CMD that MIB reports for llama3/mcqa. A circuit that could not be produced scores 0.
