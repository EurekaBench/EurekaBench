task_vocabulary = ["ice shelves"]
verifier_image = "fenicsx-verifier.sif"

[metadata.simulator]
name = "fenicsx"
served = false

[[metadata.source_literature]]
titles = ["Deep learning the flow law of Antarctic ice shelves"]
phrases = ["flow law of antarctic ice shelves", "diffice", "diffice_jax", "yaogroup"]
authors = ["Wang", "Lai", "Prior", "Cowen-Breen"]
years = [2025]
venues = ["Science"]
ids = ["10.1126/science.adp3300", "science.adp3300", "adp3300", "YaoGroup/DIFFICE_jax", "DIFFICE_jax"]

[metadata.judge]
code_in_insights = true

[agent]
timeout_sec = 14400

[verifier]
timeout_sec = 172800
environment_mode = "separate"

[environment]
docker_image = "fenicsx.sif"
workdir = "/workspace"
