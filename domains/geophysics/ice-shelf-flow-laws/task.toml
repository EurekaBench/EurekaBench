    "pypi.python.org", "files.pythonhosted.org", "registry.npmjs.org", "conda.anaconda.org", "anaconda.org",
    "readthedocs.io", "diffice-jax.readthedocs.io", "readthedocs.org", "huggingface.co", "zenodo.org",
    "science.org", "www.science.org", "advances.science.org", "researchsquare.com", "www.researchsquare.com",
    "assets.researchsquare.com", "nsidc.org", "www.nsidc.org", "n5eil01u.ecs.nsidc.org", "nature.com",
    "www.nature.com", "sciencedirect.com", "www.sciencedirect.com", "agupubs.onlinelibrary.wiley.com",
    "onlinelibrary.wiley.com", "cambridge.org", "www.cambridge.org", "tc.copernicus.org", "copernicus.org",
    "www.copernicus.org", "semanticscholar.org", "www.semanticscholar.org", "api.semanticscholar.org",
