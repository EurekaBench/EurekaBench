[project]
name = "eurekabench"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.23.0",
    "fire==0.7.1",
    "numpy==1.26.4",
    "c302 @ git+https://github.com/openworm/c302.git@6cd861f8ca4d3241ee9cf4627884caa930dab53c",
    "pyNeuroML==1.3.22",
    "libNeuroML==0.6.7",
    "PyLEMS==0.6.9",
    "neuromllite==0.6.1",
    "cect==0.3.1",
    "wormneuroatlas==0.0.7.3",
]

[project.scripts]
eurekabench = "eurekabench.launch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["eurekabench"]

[tool.hatch.build.targets.wheel.force-include]
"domains" = "eurekabench/domains"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "eurekabench/**" }, { file = "domains/**" }]
